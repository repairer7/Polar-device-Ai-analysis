name: Polar Health Sync & Gemini Analysis

on:
  workflow_dispatch: 
  
jobs:
  run-sync:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 可根据你实际使用的版本调整

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行主程序
        env:
          # 将 GitHub Secrets 映射为当前步骤的环境变量
          POLAR_TOKEN: ${{ secrets.POLAR_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_HOST: ${{ secrets.BARK_HOST }}
        run: |
          python main-gemini.py
